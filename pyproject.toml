[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weighted-emergent-bias"
version = "0.4.0"
description = "A runtime circuit-breaker for the Degeneration-of-Thought (DoT) problem in multi-agent LLM systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Harish" }]
keywords = ["llm", "multi-agent", "bias", "langgraph", "fairness", "circuit-breaker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "networkx>=3.0"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "jsonschema>=4.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# Plotting for the Phase 1 calibration study; the study runs without it (plots are skipped).
study = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/krishddd/weighted-emergent-bias"
Documentation = "https://github.com/krishddd/weighted-emergent-bias/blob/main/docs/DESIGN.md"

[tool.hatch.build.targets.wheel]
packages = ["src/weighted_emergent_bias"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle + pyflakes
  "I",            # isort
  "UP",           # pyupgrade
  "B",            # bugbear
  "SIM",          # simplify
  "RUF",          # ruff-specific
]

[tool.mypy]
# No python_version pin: the CI matrix runs mypy under each interpreter
# (3.10/3.11/3.12), so each job validates its own version. Pinning a single
# target makes mypy misparse third-party stubs written for a newer runtime.
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests", "studies"]

[[tool.mypy.overrides]]
module = ["networkx.*", "matplotlib.*", "langgraph.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "slow: hits a real network / model provider; excluded from default run",
]
